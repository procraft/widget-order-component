# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [14.x, 16.x, 18.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    - run: yarn
    # webpack 4 из CRA не работает с OpenSSL 3, то есть на Node >= 17, без legacy-провайдера.
    # На Node 14 и 16 такого флага не существует и процесс падает с "bad option", поэтому он
    # выставляется только для 18.x. Пустая строка в NODE_OPTIONS безвредна.
    - run: yarn build
      env:
        NODE_OPTIONS: ${{ startsWith(matrix.node-version, '18.') && '--openssl-legacy-provider' || '' }}
#    - run: yarn test:all --updateSnapshot
